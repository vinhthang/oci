name: OCI Fleet Helm & GitOps Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm Chart
        run: |
          echo "🔍 Linting charts/vinhthang-fleet..."
          helm lint charts/vinhthang-fleet
          echo "✅ Helm chart validation passed!"

      - name: Render Helm Template
        run: |
          echo "📦 Rendering Helm template..."
          helm template fleet charts/vinhthang-fleet > /dev/null
          echo "✅ Helm templating verified!"
