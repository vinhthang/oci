name: OCI Fleet Helm & GitOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml fastapi httpx uvicorn

      - name: Lint Helm Charts
        run: |
          for chart in vinhthang-fleet bec-datastores qa-router-datastores vedge-api-local; do
            echo "🔍 Linting charts/$chart..."
            if [ -f "charts/$chart/values.secrets.example.yaml" ]; then
              helm lint "charts/$chart" -f "charts/$chart/values.secrets.example.yaml"
            else
              helm lint "charts/$chart"
            fi
          done
          echo "✅ All Helm charts linted!"

      - name: Render Helm Templates
        run: |
          for chart in vinhthang-fleet bec-datastores qa-router-datastores vedge-api-local; do
            echo "📦 Rendering charts/$chart..."
            if [ -f "charts/$chart/values.secrets.example.yaml" ]; then
              helm template test "charts/$chart" -f "charts/$chart/values.secrets.example.yaml" > /dev/null
            else
              helm template test "charts/$chart" > /dev/null
            fi
          done
          echo "✅ All Helm templates rendered!"

      - name: Check Terraform Formatting
        run: |
          terraform fmt -check -recursive
          echo "✅ Terraform formatting verified!"

      - name: Run Offline Architectural Fitness Suite
        run: |
          PYTHONDONTWRITEBYTECODE=1 pytest -v tests/
