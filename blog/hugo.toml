baseURL = 'https://vinhthang.dev/'
languageCode = 'en-us'
title = "Vinh Thang's Tech Notes"
theme = 'PaperMod'
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  title = "Vinh Thang's Tech Notes"
  description = "Engineering insights on Kubernetes, Autonomous AI Agents, DevOps, and Always Free Cloud Architecture."
  keywords = ["Kubernetes", "K3s", "Oracle Cloud", "OCI", "AI", "LLM", "AnythingLLM", "Antigravity", "DevOps", "Terraform", "PostgreSQL", "Cloudflare WARP"]
  author = "Thang Hoang & Antigravity"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  [params.homeInfoParams]
    Title = "👋 Hi, I’m Thang Hoang — Software Developer"
    Content = "Welcome to my personal engineering blog! Co-crafted with prompt engineering and AI pair-programming on Oracle Cloud Always Free infrastructure.<br><br>📍 *Hosted on my production hybrid K3s cluster in Tokyo.*"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vinhthang"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Articles"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "archives"
    name = "📚 Archive"
    url = "/archives/"
    weight = 20

  [[menu.main]]
    identifier = "search"
    name = "🔍 Search"
    url = "/search/"
    weight = 30

  [[menu.main]]
    identifier = "tags"
    name = "🏷️ Tags"
    url = "/tags/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]
