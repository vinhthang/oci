apiVersion: v1
kind: ConfigMap
metadata:
  name: vedge-api-postgres-init
  namespace: cloud-qa-{{ .Values.becSuffix }}
  labels:
    app: vedge-api-postgres-service
data:
  01-init-bec-dbs.sql: |
    SELECT 'CREATE DATABASE vedge_api_device' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_device')\gexec
    SELECT 'CREATE DATABASE vedge_api_firmware' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_firmware')\gexec
    SELECT 'CREATE DATABASE "vedge_api_Telemetry"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_Telemetry')\gexec
    SELECT 'CREATE DATABASE vedge_api_speedtest' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_speedtest')\gexec
    SELECT 'CREATE DATABASE vedge_api_migration' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_migration')\gexec
    SELECT 'CREATE DATABASE vedge_api_topology' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_topology')\gexec
    SELECT 'CREATE DATABASE vedge_api_scheduler' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_scheduler')\gexec
    SELECT 'CREATE DATABASE vedge_api_reports' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_reports')\gexec
    SELECT 'CREATE DATABASE "vedge_api_wifi_Scheduler"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_wifi_Scheduler')\gexec
    SELECT 'CREATE DATABASE vedge_api_virtual_device' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_api_virtual_device')\gexec
    SELECT 'CREATE DATABASE vedge_device_event' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_device_event')\gexec
    SELECT 'CREATE DATABASE device_init_data' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'device_init_data')\gexec
    SELECT 'CREATE DATABASE cpe_control_data' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'cpe_control_data')\gexec
    SELECT 'CREATE DATABASE session_manager_data' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'session_manager_data')\gexec
    SELECT 'CREATE DATABASE service_provision_data' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'service_provision_data')\gexec
    SELECT 'CREATE DATABASE fn_cpe_registration_data' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'fn_cpe_registration_data')\gexec
    SELECT 'CREATE DATABASE vedge_control_data' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_control_data')\gexec
    SELECT 'CREATE DATABASE environment_data' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'environment_data')\gexec
    SELECT 'CREATE DATABASE pulsar_admin_data' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'pulsar_admin_data')\gexec
    SELECT 'CREATE DATABASE vedge_jsim_data' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vedge_jsim_data')\gexec
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vedge-api-postgres-service
  namespace: cloud-qa-{{ .Values.becSuffix }}
  labels:
    app: vedge-api-postgres-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vedge-api-postgres-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vedge-api-postgres-service
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          {{- if .Values.postgres.args }}
          args:
            {{- toYaml .Values.postgres.args | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: init-scripts
          configMap:
            name: vedge-api-postgres-init
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vedge-api-postgres-service
  namespace: cloud-qa-{{ .Values.becSuffix }}
  labels:
    app: vedge-api-postgres-service
spec:
  type: ClusterIP
  selector:
    app: vedge-api-postgres-service
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
