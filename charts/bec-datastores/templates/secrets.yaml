# PostgreSQL credentials secrets
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: cloud-qa-{{ .Values.becSuffix }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: cloud-qa-{{ .Values.becSuffix }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
---
# Redis credentials secrets
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: cloud-qa-{{ .Values.becSuffix }}
type: Opaque
stringData:
  password: ""
  REDIS_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: redb-redb-cloud-qa-{{ .Values.becSuffix }}
  namespace: cloud-qa-{{ .Values.becSuffix }}
type: Opaque
stringData:
  password: ""
  REDIS_PASSWORD: ""
---
# MongoDB credentials secrets
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: cloud-qa-{{ .Values.becSuffix }}
type: Opaque
stringData:
  username: {{ .Values.mongodb.user | quote }}
  password: {{ .Values.mongodb.password | quote }}
  MONGO_USER: {{ .Values.mongodb.user | quote }}
  MONGO_PASSWORD: {{ .Values.mongodb.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mck-user-useradmin-password
  namespace: cloud-qa-{{ .Values.becSuffix }}
type: Opaque
stringData:
  username: {{ .Values.mongodb.user | quote }}
  password: {{ .Values.mongodb.password | quote }}
