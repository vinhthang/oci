becSuffix: "f1"
arm10Host: "10.0.0.216"

coredns:
  enabled: true

postgres:
  image: "docker.io/postgres:16.8-alpine"
  port: 5432
  user: "postgres"
  password: "postgres_master_pass_2026"
  databases:
    - "vedge_api_device"
    - "vedge_api_firmware"
    - "vedge_api_Telemetry"
    - "vedge_api_speedtest"
    - "vedge_api_migration"
    - "vedge_api_topology"
    - "vedge_api_scheduler"
    - "vedge_api_reports"
    - "vedge_api_wifi_Scheduler"
    - "vedge_api_virtual_device"
    - "vedge_device_event"
    - "device_init_data"
    - "cpe_control_data"
    - "session_manager_data"
    - "service_provision_data"
    - "fn_cpe_registration_data"
    - "vedge_control_data"
    - "environment_data"
    - "pulsar_admin_data"
    - "vedge_jsim_data"
  args:
    - "-c"
    - "max_connections=2000"
    - "-c"
    - "shared_buffers=512MB"
    - "-c"
    - "work_mem=4MB"
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"

redis:
  image: "docker.io/redis:7.4.2-alpine"
  port: 12000
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"

mongodb:
  image: "docker.io/mongo:7.0.16"
  port: 27017
  user: "userAdmin"
  password: "userAdminSecret123"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

pulsar:
  image: "docker.io/apachepulsar/pulsar:3.0.7"
  internal:
    enabled: true
    pulsarMem: "-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=512m"
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
  external:
    enabled: true
    pulsarMem: "-Xms1024m -Xmx1536m -XX:MaxDirectMemorySize=1024m"
    resources:
      requests:
        cpu: "200m"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
