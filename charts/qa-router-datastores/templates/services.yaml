# Pulsar Broker notification service and EndpointSlice
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.pulsar.brokerServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: pulsar-broker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: pulsar
      port: {{ .Values.pulsar.ports.broker }}
      targetPort: {{ .Values.pulsar.ports.broker }}
      protocol: TCP
    - name: pulsar-ssl
      port: {{ .Values.pulsar.ports.brokerTls }}
      targetPort: {{ .Values.pulsar.ports.brokerTls }}
      protocol: TCP
    - name: http
      port: {{ .Values.pulsar.ports.adminHttp }}
      targetPort: {{ .Values.pulsar.arm10AdminHttpPort }}
      protocol: TCP
    - name: https
      port: {{ .Values.pulsar.ports.adminHttps }}
      targetPort: {{ .Values.pulsar.ports.adminHttps }}
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .Values.pulsar.brokerServiceName }}-1
  namespace: {{ .Values.namespace }}
  labels:
    kubernetes.io/service-name: {{ .Values.pulsar.brokerServiceName }}
    app.kubernetes.io/name: pulsar-broker
addressType: IPv4
ports:
  - name: pulsar
    port: {{ .Values.pulsar.ports.broker }}
    protocol: TCP
  - name: pulsar-ssl
    port: {{ .Values.pulsar.ports.brokerTls }}
    protocol: TCP
  - name: http
    port: {{ .Values.pulsar.arm10AdminHttpPort }}
    protocol: TCP
  - name: https
    port: {{ .Values.pulsar.ports.adminHttps }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ .Values.arm10Host | quote }}
    conditions:
      ready: true
---
