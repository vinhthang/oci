# PostgreSQL service and EndpointSlice
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .Values.postgres.serviceName }}-1
  namespace: {{ .Values.namespace }}
  labels:
    kubernetes.io/service-name: {{ .Values.postgres.serviceName }}
    app.kubernetes.io/name: postgres
addressType: IPv4
ports:
  - name: postgres
    port: {{ .Values.postgres.port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ .Values.arm10Host | quote }}
    conditions:
      ready: true
---
