arm10Host: "10.0.0.216"
namespace: "cloud-qa-router"
createSecrets: false

coredns:
  enabled: true
  domainSuffix: "corp.intranet"

postgres:
  serviceName: "vedge-api-postgres-service"
  port: 5432
  user: "postgres"
  password: "" # REQUIRED when createSecrets=true; pass via values.secrets.yaml or --set postgres.password=<pw>

redis:
  serviceName: "redb-cloud-qa-router-headless"
  port: 12000
  password: ""

mongodb:
  serviceName: "mck-mongodb-cloud-qa-router-mongos-lb"
  port: 27017
  user: "userAdmin"
  password: "" # REQUIRED when createSecrets=true; pass via values.secrets.yaml or --set mongodb.password=<pw>

pulsar:
  brokerServiceName: "pulsar-noti-cloud-qa-router-broker"
  adminServiceName: "vedge-api-pulsar-admin-notification-service"
  ports:
    broker: 6650
    brokerTls: 6651
    adminHttp: 8088
    adminHttps: 8443
  arm10AdminHttpPort: 12555
