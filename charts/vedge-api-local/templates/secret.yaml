{{- if and .Values.encryptionKeysSecret .Values.encryptionKeysSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.encryptionKeysSecret.name | default "ao-encryption-keys" }}
type: Opaque
stringData:
  secrets.json: |
{{ .Values.encryptionKeysSecret.secretsJson | indent 4 }}
{{- end }}
