{{- if .Values.aiIncidentCommander.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-incident-commander
  namespace: system
  labels:
    app: ai-incident-commander
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-incident-commander
  template:
    metadata:
      labels:
        app: ai-incident-commander
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.aiIncidentCommander.nodeSelector }}
      serviceAccountName: gitops-webhook # Reusing the gitops-deployer cluster role
      containers:
        - name: commander
          image: "{{ .Values.aiIncidentCommander.image.repository }}:{{ .Values.aiIncidentCommander.image.tag }}"
          imagePullPolicy: {{ .Values.aiIncidentCommander.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.aiIncidentCommander.port | default 8085 }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.aiIncidentCommander.port | default 8085 }}"
            - name: GEMINI_MODEL
              value: "{{ .Values.aiIncidentCommander.model | default "gemini-3.5-flash" }}"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postgres-secret # Alternatively, github-secret
                  key: GITHUB_TOKEN
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-ai-secret
                  key: GEMINI_EMBEDDING_API_KEY # Reusing existing key or we can create GEMINI_API_KEY
          volumeMounts:
            - name: commander-binary
              mountPath: /app/incident-commander
            - name: rtk-binary
              mountPath: /usr/local/bin/rtk
            - name: agy-binary
              mountPath: /usr/local/bin/agy
            - name: agy-config
              mountPath: /root/.gemini
      volumes:
        - name: commander-binary
          hostPath:
            path: /opt/ai-incident-commander/incident-commander
            type: FileOrCreate
        - name: rtk-binary
          hostPath:
            path: /home/opc/.cargo/bin/rtk
            type: FileOrCreate
        - name: agy-binary
          hostPath:
            path: /home/opc/.local/bin/agy
            type: FileOrCreate
        - name: agy-config
          hostPath:
            path: /home/opc/.gemini
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ai-incident-commander
  namespace: system
spec:
  type: ClusterIP
  selector:
    app: ai-incident-commander
  ports:
    - protocol: TCP
      port: {{ .Values.aiIncidentCommander.port | default 8085 }}
      targetPort: {{ .Values.aiIncidentCommander.port | default 8085 }}
{{- end }}
