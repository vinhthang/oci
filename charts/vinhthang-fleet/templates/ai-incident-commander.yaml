{{- if .Values.aiIncidentCommander.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-incident-commander
  namespace: system
  labels:
    app: ai-incident-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-incident-commander
  template:
    metadata:
      labels:
        app: ai-incident-commander
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.aiIncidentCommander.nodeSelector }}
      serviceAccountName: gitops-webhook # Reusing the gitops-deployer cluster role
      hostNetwork: true
      containers:
        - name: commander
          image: "{{ .Values.aiIncidentCommander.image.repository }}:{{ .Values.aiIncidentCommander.image.tag }}"
          imagePullPolicy: {{ .Values.aiIncidentCommander.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postgres-secret # Alternatively, github-secret
                  key: GITHUB_TOKEN
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-ai-secret
                  key: GEMINI_EMBEDDING_API_KEY # Reusing existing key or we can create GEMINI_API_KEY
          volumeMounts:
            - name: rtk-binary
              mountPath: /usr/local/bin/rtk
            - name: agy-binary
              mountPath: /home/opc/.local/bin/agy
            - name: agy-config
              mountPath: /root/.gemini
      volumes:
        - name: rtk-binary
          hostPath:
            path: /home/opc/.cargo/bin/rtk
            type: FileOrCreate
        - name: agy-binary
          hostPath:
            path: /home/opc/.local/bin/agy
            type: FileOrCreate
        - name: agy-config
          hostPath:
            path: /home/opc/.gemini
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ai-incident-commander
  namespace: system
spec:
  type: ClusterIP
  selector:
    app: ai-incident-commander
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
{{- end }}
