{{- if and .Values.collabMcp.enabled .Values.collabMcp.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.collabMcp.existingSecret | default "collab-mcp-secrets" }}
  namespace: {{ .Values.collabMcp.namespace | default "apps" }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  COLLAB_ADMIN_TOKEN: {{ required "collabMcp.adminToken is required when createSecret=true" .Values.collabMcp.adminToken | quote }}
  {{- if .Values.collabMcp.githubToken }}
  GITHUB_TOKEN: {{ .Values.collabMcp.githubToken | quote }}
  {{- end }}
---
{{- end }}
{{- if .Values.collabMcp.enabled }}
{{- $secretName := .Values.collabMcp.existingSecret | default "collab-mcp-secrets" }}
{{- $reviewSecretName := .Values.collabMcp.existingReviewSecret | default "review-server-secrets" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-mcp
  namespace: {{ .Values.collabMcp.namespace | default "apps" }}
  labels:
    app: collab-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collab-mcp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: collab-mcp
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.collabMcp.nodeSelector | default "arm10" }}
      containers:
        - name: collab-mcp
          image: "{{ .Values.collabMcp.image.repository }}:{{ .Values.collabMcp.image.tag }}"
          imagePullPolicy: {{ .Values.collabMcp.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.collabMcp.port | default 8766 }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.collabMcp.port | default 8766 }}"
            - name: HOST
              value: "0.0.0.0"
            - name: PUBLIC_BASE_URL
              value: {{ .Values.collabMcp.publicBaseUrl | default "https://collab.vinhthang.dev" | quote }}
            - name: COLLAB_BOOKS_REPO
              value: {{ .Values.collabMcp.booksRepo | default "vinhthang/collab-books" | quote }}
            - name: COLLAB_DATA_DIR
              value: "/data"
            - name: REVIEW_SERVER_URL
              value: {{ .Values.collabMcp.reviewServerUrl | default "http://review-server.apps.svc.cluster.local:8765" | quote }}
            - name: TRUST_ADMIN_SSO_HEADER
              value: "true"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-primary.data.svc.cluster.local:5432/review_service?sslmode=disable"
            - name: COLLAB_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: COLLAB_ADMIN_TOKEN
            - name: REVIEW_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $reviewSecretName }}
                  key: REVIEW_BEARER_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_TOKEN
                  optional: true
          volumeMounts:
            - name: collab-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.collabMcp.resources | nindent 12 }}
      volumes:
        - name: collab-data
          hostPath:
            path: {{ .Values.collabMcp.storagePath | default "/opt/collab-mcp/data" }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: collab-mcp
  namespace: {{ .Values.collabMcp.namespace | default "apps" }}
  labels:
    app: collab-mcp
spec:
  type: NodePort
  selector:
    app: collab-mcp
  ports:
    - protocol: TCP
      port: {{ .Values.collabMcp.port | default 8766 }}
      targetPort: {{ .Values.collabMcp.port | default 8766 }}
      nodePort: {{ .Values.collabMcp.nodePort | default 30016 }}
{{- end }}
