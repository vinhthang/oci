{{- if and .Values.forgejo.enabled .Values.forgejo.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.forgejo.existingSecret | default "forgejo-secrets" }}
  namespace: {{ .Values.forgejo.namespace | default "apps" }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  FORGEJO_ADMIN_USER: {{ .Values.forgejo.adminUser | default "thang" | quote }}
  FORGEJO_ADMIN_EMAIL: {{ .Values.forgejo.adminEmail | default "admin@vinhthang.dev" | quote }}
  FORGEJO_ADMIN_PASSWORD: {{ required "forgejo.adminPassword is required when createSecret=true" .Values.forgejo.adminPassword | quote }}
  FORGEJO_SECRET_KEY: {{ required "forgejo.secretKey is required when createSecret=true" .Values.forgejo.secretKey | quote }}
  FORGEJO_INTERNAL_TOKEN: {{ required "forgejo.internalToken is required when createSecret=true" .Values.forgejo.internalToken | quote }}
---
{{- end }}
{{- if .Values.forgejo.enabled }}
{{- $secretName := .Values.forgejo.existingSecret | default "forgejo-secrets" }}
{{- $pgVersion := .Values.postgres.image | default "docker.io/pgvector/pgvector:pg18" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: {{ .Values.forgejo.namespace | default "apps" }}
  labels:
    app: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.forgejo.nodeSelector | default .Values.global.armNodeHostname }}
      initContainers:
        - name: init-permissions
          image: {{ $pgVersion }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - "/bin/sh"
            - "-c"
            - "mkdir -p /var/lib/gitea /etc/gitea && chown -R 1000:1000 /var/lib/gitea /etc/gitea"
          volumeMounts:
            - name: forgejo-data
              mountPath: /var/lib/gitea
            - name: forgejo-config
              mountPath: /etc/gitea
        - name: init-postgres-db
          image: {{ $pgVersion }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              psql -h postgres-primary.data.svc.cluster.local -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'forgejo'" | grep -q 1 || \
                psql -h postgres-primary.data.svc.cluster.local -U postgres -c 'CREATE DATABASE "forgejo";'
      containers:
        - name: forgejo
          image: "{{ .Values.forgejo.image.repository }}:{{ .Values.forgejo.image.tag }}"
          imagePullPolicy: {{ .Values.forgejo.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: {{ .Values.forgejo.port | default 3000 }}
              name: http
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: FORGEJO_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: FORGEJO_ADMIN_USER
                  optional: true
            - name: FORGEJO_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: FORGEJO_ADMIN_EMAIL
                  optional: true
            - name: FORGEJO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: FORGEJO_ADMIN_PASSWORD
                  optional: true
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: FORGEJO_SECRET_KEY
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: FORGEJO_INTERNAL_TOKEN
            - name: FORGEJO__server__DOMAIN
              value: {{ .Values.forgejo.publicDomain | default "git.vinhthang.dev" | quote }}
            - name: FORGEJO__server__ROOT_URL
              value: {{ .Values.forgejo.publicBaseUrl | default "https://git.vinhthang.dev/" | quote }}
            - name: FORGEJO__server__HTTP_PORT
              value: {{ .Values.forgejo.port | default 3000 | quote }}
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: "postgres"
            - name: FORGEJO__database__HOST
              value: "postgres-primary.data.svc.cluster.local:5432"
            - name: FORGEJO__database__NAME
              value: "forgejo"
            - name: FORGEJO__database__USER
              value: "postgres"
            - name: FORGEJO__database__PASSWD
              value: "$(POSTGRES_PASSWORD)"
            - name: FORGEJO__database__SSL_MODE
              value: "disable"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: FORGEJO__service__ENABLE_NOTIFY_MAIL
              value: "false"
            - name: FORGEJO__repository__DEFAULT_MERGE_STYLE
              value: "squash"
            - name: FORGEJO__repository.pull-request__DEFAULT_MERGE_STYLE
              value: "squash"
            - name: FORGEJO__actions__ENABLED
              value: "true"
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/sh"
                  - "-c"
                  - |
                    (
                      if [ -n "$FORGEJO_ADMIN_USER" ] && [ -n "$FORGEJO_ADMIN_PASSWORD" ]; then
                        i=0
                        while [ "$i" -lt 30 ]; do
                          if wget -q -O /dev/null http://127.0.0.1:3000/api/healthz 2>/dev/null || curl -fsS http://127.0.0.1:3000/api/healthz >/dev/null 2>&1; then
                            if ! forgejo --work-path /var/lib/gitea --config /etc/gitea/app.ini admin user list --admin 2>/dev/null | grep -qw "$FORGEJO_ADMIN_USER"; then
                              if ! forgejo --work-path /var/lib/gitea --config /etc/gitea/app.ini admin user create --admin \
                                --username "$FORGEJO_ADMIN_USER" \
                                --password "$FORGEJO_ADMIN_PASSWORD" \
                                --email "${FORGEJO_ADMIN_EMAIL:-admin@vinhthang.dev}" \
                                --must-change-password=false >/dev/null 2>&1; then
                                echo "forgejo postStart: admin user already initialized or skipped" >&2
                              fi
                            fi
                            break
                          fi
                          i=$((i + 1))
                          sleep 1
                        done
                      fi
                    ) &
          volumeMounts:
            - name: forgejo-data
              mountPath: /var/lib/gitea
            - name: forgejo-config
              mountPath: /etc/gitea
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.forgejo.resources | nindent 12 }}
      volumes:
        - name: forgejo-data
          hostPath:
            path: {{ .Values.forgejo.storagePath | default "/opt/forgejo/data" }}
            type: DirectoryOrCreate
        - name: forgejo-config
          hostPath:
            path: {{ .Values.forgejo.configPath | default "/opt/forgejo/config" }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: {{ .Values.forgejo.namespace | default "apps" }}
  labels:
    app: forgejo
spec:
  type: NodePort
  selector:
    app: forgejo
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.forgejo.port | default 3000 }}
      targetPort: {{ .Values.forgejo.port | default 3000 }}
      nodePort: {{ .Values.forgejo.nodePort | default 30017 }}
{{- end }}
