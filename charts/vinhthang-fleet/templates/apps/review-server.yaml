{{- if and .Values.reviewServer.enabled .Values.reviewServer.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.reviewServer.existingSecret | default "review-server-secrets" }}
  namespace: {{ .Values.reviewServer.namespace | default "apps" }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  REVIEW_BEARER_TOKEN: {{ required "reviewServer.bearerToken is required when createSecret=true" .Values.reviewServer.bearerToken | quote }}
  {{- if .Values.reviewServer.deepseekApiKey }}
  DEEPSEEK_API_KEY: {{ .Values.reviewServer.deepseekApiKey | quote }}
  {{- end }}
  {{- if .Values.reviewServer.githubToken }}
  GITHUB_TOKEN: {{ .Values.reviewServer.githubToken | quote }}
  {{- end }}
  {{- if .Values.reviewServer.gitlabToken }}
  GITLAB_TOKEN: {{ .Values.reviewServer.gitlabToken | quote }}
  {{- end }}
  {{- if .Values.reviewServer.githubWebhookSecret }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.reviewServer.githubWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.reviewServer.gitlabWebhookSecret }}
  GITLAB_WEBHOOK_SECRET: {{ .Values.reviewServer.gitlabWebhookSecret | quote }}
  {{- end }}
---
{{- end }}
{{- if and .Values.reviewServer.enabled .Values.reviewServer.createForgejoSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.reviewServer.existingForgejoSecret | default "forgejo-review-secrets" }}
  namespace: {{ .Values.reviewServer.namespace | default "apps" }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  FORGEJO_TOKEN: {{ required "reviewServer.forgejoToken is required when createForgejoSecret=true" .Values.reviewServer.forgejoToken | quote }}
  FORGEJO_WEBHOOK_SECRET: {{ required "reviewServer.forgejoWebhookSecret is required when createForgejoSecret=true" .Values.reviewServer.forgejoWebhookSecret | quote }}
---
{{- end }}
{{- if and .Values.reviewServer.enabled .Values.reviewServer.createProxySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.reviewServer.existingProxySecret | default "review-proxy-auth-secret" }}
  namespace: {{ .Values.reviewServer.namespace | default "apps" }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  PROXY_AUTH_SECRET: {{ required "reviewServer.proxyAuthSecret is required when createProxySecret=true" .Values.reviewServer.proxyAuthSecret | quote }}
---
{{- end }}
{{- if .Values.reviewServer.enabled }}
{{- $secretName := .Values.reviewServer.existingSecret | default "review-server-secrets" }}
{{- $forgejoSecretName := .Values.reviewServer.existingForgejoSecret | default "forgejo-review-secrets" }}
{{- $proxySecretName := .Values.reviewServer.existingProxySecret | default "review-proxy-auth-secret" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-server
  namespace: {{ .Values.reviewServer.namespace | default "apps" }}
  labels:
    app: review-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: review-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.reviewServer.nodeSelector | default .Values.global.armNodeHostname }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: review-server
          image: "{{ .Values.reviewServer.image.repository }}:{{ .Values.reviewServer.image.tag }}"
          imagePullPolicy: {{ .Values.reviewServer.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.reviewServer.port | default 8765 }}
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOME
              value: "/home/node"
            - name: PORT
              value: "{{ .Values.reviewServer.port | default 8765 }}"
            - name: HOST
              value: "0.0.0.0"
            - name: PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $proxySecretName }}
                  key: PROXY_AUTH_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres-primary.data.svc.cluster.local:5432/review_service?sslmode=disable"
            - name: REVIEW_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: REVIEW_BEARER_TOKEN
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_TOKEN
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITLAB_TOKEN
                  optional: true
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITHUB_WEBHOOK_SECRET
                  optional: true
            - name: GITLAB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GITLAB_WEBHOOK_SECRET
                  optional: true
            - name: GITLAB_ALLOWED_HOSTS
              value: {{ .Values.reviewServer.gitlabAllowedHosts | default "gitlab.com" | quote }}
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $forgejoSecretName }}
                  key: FORGEJO_TOKEN
                  optional: true
            - name: FORGEJO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $forgejoSecretName }}
                  key: FORGEJO_WEBHOOK_SECRET
                  optional: true
            - name: FORGEJO_ALLOWED_HOSTS
              value: {{ .Values.reviewServer.forgejoAllowedHosts | default "git.vinhthang.dev" | quote }}
            - name: FORGEJO_INTERNAL_API_URL
              value: {{ .Values.reviewServer.forgejoInternalApiUrl | default "http://forgejo.apps.svc.cluster.local:3000/api/v1" | quote }}
            - name: FORGEJO_AUTO_MERGE_ON_PASS
              value: {{ .Values.reviewServer.forgejoAutoMergeOnPass | default "true" | quote }}
            - name: FORGEJO_BOT_USERNAME
              value: {{ .Values.reviewServer.forgejoBotUsername | default "review-bot" | quote }}
            - name: AGY_PATH
              value: "/usr/local/bin/agy"
            - name: AGY_MODEL
              value: {{ .Values.reviewServer.agyModel | default "gemini-3.8-flash-high" | quote }}
            - name: AGY_MODE
              value: {{ .Values.reviewServer.agyMode | default "supervisor" | quote }}
            - name: AGY_MAX_TURNS_PER_WORKER
              value: {{ .Values.reviewServer.agyMaxTurnsPerWorker | default "1" | quote }}
            - name: AGY_TURN_TIMEOUT_MS
              value: {{ .Values.reviewServer.agyTurnTimeoutMs | default "300000" | quote }}
            - name: AGY_MAX_TURN_DURATION_MS
              value: {{ .Values.reviewServer.agyMaxTurnDurationMs | default "420000" | quote }}
            - name: AGY_STARTUP_TIMEOUT_MS
              value: {{ .Values.reviewServer.agyStartupTimeoutMs | default "180000" | quote }}
          volumeMounts:
            - name: host-agy
              mountPath: /usr/local/bin/agy
            - name: host-gemini
              mountPath: /home/node/.gemini
            - name: host-config
              mountPath: /home/node/.config
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.reviewServer.resources | nindent 12 }}
      volumes:
        - name: host-agy
          hostPath:
            path: /home/opc/.local/bin/agy
            type: File
        - name: host-gemini
          hostPath:
            path: /home/opc/.gemini
            type: Directory
        - name: host-config
          hostPath:
            path: /home/opc/.config
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: review-server
  namespace: {{ .Values.reviewServer.namespace | default "apps" }}
  labels:
    app: review-server
spec:
  type: NodePort
  selector:
    app: review-server
  ports:
    - protocol: TCP
      port: {{ .Values.reviewServer.port | default 8765 }}
      targetPort: {{ .Values.reviewServer.port | default 8765 }}
      nodePort: {{ .Values.reviewServer.nodePort | default 30015 }}
{{- end }}
