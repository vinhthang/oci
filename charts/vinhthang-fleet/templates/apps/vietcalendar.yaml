apiVersion: apps/v1
kind: Deployment
metadata:
  name: vietcalendar
  namespace: apps
  labels:
    app: vietcalendar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vietcalendar
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vietcalendar
      {{- if .Values.vietcalendar.rolloutTimestamp }}
      annotations:
        vinhthang.dev/rollout-at: {{ .Values.vietcalendar.rolloutTimestamp | quote }}
      {{- end }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.vietcalendar.nodeSelector | default .Values.global.armNodeHostname }}
      containers:
        - name: vietcalendar
          image: {{ .Values.vietcalendar.image }}
          imagePullPolicy: {{ .Values.vietcalendar.imagePullPolicy | default "IfNotPresent" }}
          env:
            - name: PORT
              value: {{ .Values.vietcalendar.port | default 8087 | quote }}
          ports:
            - containerPort: {{ .Values.vietcalendar.port | default 8087 }}
              name: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.vietcalendar.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vietcalendar
  namespace: apps
spec:
  type: NodePort
  selector:
    app: vietcalendar
  ports:
    - protocol: TCP
      port: {{ .Values.vietcalendar.port | default 8087 }}
      targetPort: {{ .Values.vietcalendar.port | default 8087 }}
      nodePort: {{ .Values.vietcalendar.nodePort }}
