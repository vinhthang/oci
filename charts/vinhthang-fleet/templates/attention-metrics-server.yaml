{{- if .Values.attentionMetricsServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attention-metrics-server
  namespace: observability
  labels:
    app: attention-metrics-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attention-metrics-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: attention-metrics-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.attentionMetricsServer.nodeSelector | default "arm10" }}
      containers:
        - name: attention-metrics-server
          image: "{{ .Values.attentionMetricsServer.image.repository }}:{{ .Values.attentionMetricsServer.image.tag }}"
          imagePullPolicy: {{ .Values.attentionMetricsServer.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.attentionMetricsServer.port | default 8086 }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.attentionMetricsServer.port | default 8086 }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres-primary.data.svc.cluster.local:5432/attention_metrics?sslmode=disable"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.attentionMetricsServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: attention-metrics-server
  namespace: observability
  labels:
    app: attention-metrics-server
spec:
  type: NodePort
  selector:
    app: attention-metrics-server
  ports:
    - protocol: TCP
      port: {{ .Values.attentionMetricsServer.port | default 8086 }}
      targetPort: {{ .Values.attentionMetricsServer.port | default 8086 }}
      nodePort: {{ .Values.attentionMetricsServer.nodePort | default 30012 }}
{{- end }}
