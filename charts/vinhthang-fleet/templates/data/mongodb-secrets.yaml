{{- if and .Values.mongodb.enabled .Values.mongodb.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mongodb.existingSecret | default "mongodb-secrets" }}
  namespace: data
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  MONGODB_BACKUP_USER: backup
  MONGODB_BACKUP_PASSWORD: {{ required "mongodb.backupPassword is required when createSecret=true" .Values.mongodb.backupPassword | quote }}
  MONGODB_DATABASE_ADMIN_USER: databaseAdmin
  MONGODB_DATABASE_ADMIN_PASSWORD: {{ required "mongodb.adminPassword is required when createSecret=true" .Values.mongodb.adminPassword | quote }}
  MONGODB_CLUSTER_ADMIN_USER: clusterAdmin
  MONGODB_CLUSTER_ADMIN_PASSWORD: {{ required "mongodb.clusterAdminPassword is required when createSecret=true" .Values.mongodb.clusterAdminPassword | quote }}
  MONGODB_CLUSTER_MONITOR_USER: clusterMonitor
  MONGODB_CLUSTER_MONITOR_PASSWORD: {{ required "mongodb.monitorPassword is required when createSecret=true" .Values.mongodb.monitorPassword | quote }}
  MONGODB_USER_ADMIN_USER: userAdmin
  MONGODB_USER_ADMIN_PASSWORD: {{ required "mongodb.userAdminPassword is required when createSecret=true" .Values.mongodb.userAdminPassword | quote }}
{{- end }}
