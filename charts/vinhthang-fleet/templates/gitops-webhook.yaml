apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-webhook
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-deployer
rules:
  - apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io", "rbac.authorization.k8s.io", "storage.k8s.io", "helm.cattle.io", "policy", "monitoring.coreos.com", "redis.redis.opstreelabs.in", "psmdb.percona.com"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitops-deployer
subjects:
  - kind: ServiceAccount
    name: gitops-webhook
    namespace: system
---
{{- if and .Values.gitopsWebhook .Values.gitopsWebhook.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gitopsWebhook.existingSecret | default "gitops-webhook-secret" }}
  namespace: system
type: Opaque
stringData:
  webhook-secret: {{ .Values.gitopsWebhook.secret | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-webhook-script
  namespace: system
data:
  receiver.py: |
    import hmac
    import hashlib
    import json
    import os
    import sys
    from http.server import HTTPServer, BaseHTTPRequestHandler

    SECRET = os.environ.get("GITHUB_WEBHOOK_SECRET", "").encode("utf-8")
    PORT = int(os.environ.get("PORT", "9000"))

    class WebhookHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in ("/healthz", "/"):
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"OK\n")
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            content_len = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(content_len)

            if SECRET:
                hub_signature = self.headers.get("X-Hub-Signature-256", "")
                if not hub_signature.startswith("sha256="):
                    self.send_response(401)
                    self.send_header("Content-Type", "text/plain")
                    self.end_headers()
                    self.wfile.write(b"Missing or invalid signature header\n")
                    return

                expected_sig = "sha256=" + hmac.new(SECRET, body, hashlib.sha256).hexdigest()
                if not hmac.compare_digest(expected_sig, hub_signature):
                    self.send_response(403)
                    self.send_header("Content-Type", "text/plain")
                    self.end_headers()
                    self.wfile.write(b"Signature verification failed\n")
                    return

            event = self.headers.get("X-GitHub-Event", "push")
            if event == "ping":
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"Pong\n")
                return

            try:
                payload = json.loads(body.decode("utf-8"))
                ref = payload.get("ref", "")
                if ref and ref != "refs/heads/main":
                    self.send_response(200)
                    self.send_header("Content-Type", "text/plain")
                    self.end_headers()
                    self.wfile.write(b"Ignored non-main branch\n")
                    return
            except Exception:
                pass

            with open("/tmp/gitops-trigger", "w") as f:
                f.write("trigger\n")

            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(b"GitOps Deploy Triggered\n")

        def log_message(self, format, *args):
            sys.stderr.write(f"[{self.log_date_time_string()}] {format % args}\n")

    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", PORT), WebhookHandler)
        sys.stderr.write(f"🚀 Authenticated GitOps Webhook Receiver listening on port {PORT}...\n")
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-webhook
  namespace: system
  labels:
    app: gitops-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-webhook
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitops-webhook
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      serviceAccountName: gitops-webhook
      hostNetwork: true
      containers:
        - name: webhook
          image: docker.io/alpine/k8s:1.31.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: {{ (.Values.gitopsWebhook | default dict).port | default 9000 | quote }}
            {{- if and .Values.gitopsWebhook .Values.gitopsWebhook.useSecret }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitopsWebhook.existingSecret | default "gitops-webhook-secret" }}
                  key: {{ .Values.gitopsWebhook.secretKey | default "webhook-secret" }}
                  optional: true
            {{- end }}
          command:
            - "/bin/sh"
            - "-c"
            - |
              echo "🚀 Initializing GitOps Webhook and Reconcile Daemon..."

              # Background Reconcile Worker
              reconcile_worker() {
                while true; do
                  if [ -f /tmp/gitops-trigger ]; then
                    rm -f /tmp/gitops-trigger
                    echo "⚡ [$(date)] Authenticated GitHub Webhook push event triggered! Starting GitOps reconcile..."
                    rm -rf /tmp/vinhthang-fleet
                    if git clone --depth 1 https://github.com/vinhthang/oci.git /tmp/vinhthang-fleet; then
                      echo "📥 Repository pulled successfully. Upgrading Helm Fleet..."
                      if helm upgrade --install fleet /tmp/vinhthang-fleet/charts/vinhthang-fleet -n default --no-hooks; then
                        echo "✅ [$(date)] GitOps reconcile finished successfully!"
                        curl -s -X POST http://10.0.0.235:8999/ || true
                      else
                        echo "❌ Helm upgrade failed! Crashing pod to trigger Grafana alert..."
                        kill 1
                      fi
                    else
                      echo "❌ Failed to clone repository. Crashing pod to trigger Grafana alert..."
                      kill 1
                    fi
                  fi
                  sleep 2
                done
              }
              reconcile_worker &

              # Start Authenticated Python Webhook Receiver
              exec python3 /opt/webhook/receiver.py
          ports:
            - containerPort: {{ (.Values.gitopsWebhook | default dict).port | default 9000 }}
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: webhook-script
              mountPath: /opt/webhook
      volumes:
        - name: webhook-script
          configMap:
            name: gitops-webhook-script
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-webhook
  namespace: system
spec:
  type: NodePort
  selector:
    app: gitops-webhook
  ports:
    - protocol: TCP
      port: {{ (.Values.gitopsWebhook | default dict).port | default 9000 }}
      targetPort: {{ (.Values.gitopsWebhook | default dict).port | default 9000 }}
      nodePort: {{ (.Values.gitopsWebhook | default dict).nodePort | default 30009 }}
