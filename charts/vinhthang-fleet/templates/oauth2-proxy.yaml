apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-oauth2-proxy
  namespace: system
  labels:
    app: central-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-oauth2-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: central-oauth2-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/oauth2-proxy/oauth2-proxy.cfg"
          ports:
            - containerPort: 4180
              name: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy
          resources:
            {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
      volumes:
        - name: config
          hostPath:
            path: /opt/oauth2-proxy
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: central-oauth2-proxy
  namespace: system
spec:
  type: NodePort
  selector:
    app: central-oauth2-proxy
  ports:
    - protocol: TCP
      port: 4180
      targetPort: 4180
      nodePort: {{ .Values.oauth2Proxy.nodePort }}
