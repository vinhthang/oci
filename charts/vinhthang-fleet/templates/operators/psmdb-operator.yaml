{{- if and .Values.mongodbOperator.enabled (not .Values.redisOperator.enabled) }}
apiVersion: v1
kind: Namespace
metadata:
  name: operators
  labels:
    app.kubernetes.io/managed-by: Helm
---
{{- end }}
{{- if .Values.mongodbOperator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: psmdb-operator
  namespace: operators
  labels:
    app.kubernetes.io/name: psmdb-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: psmdb-operator
  labels:
    app.kubernetes.io/name: psmdb-operator
rules:
  - apiGroups:
      - psmdb.percona.com
    resources:
      - '*'
    verbs:
      - '*'
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/exec
      - services
      - endpoints
      - persistentvolumeclaims
      - configmaps
      - secrets
      - events
      - nodes
    verbs:
      - '*'
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - '*'
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - '*'
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - '*'
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - '*'
  - apiGroups:
      - cert-manager.io
      - certmanager.k8s.io
    resources:
      - issuers
      - certificates
      - certificaterequests
    verbs:
      - '*'
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - '*'
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: psmdb-operator
  labels:
    app.kubernetes.io/name: psmdb-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: psmdb-operator
subjects:
  - kind: ServiceAccount
    name: psmdb-operator
    namespace: operators
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psmdb-operator
  namespace: operators
  labels:
    app.kubernetes.io/name: psmdb-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: psmdb-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: psmdb-operator
    spec:
      serviceAccountName: psmdb-operator
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.mongodbOperator.nodeHostname | default "arm10" }}
      containers:
        - name: psmdb-operator
          image: {{ .Values.mongodbOperator.image | default "percona/percona-server-mongodb-operator:1.23.0" }}
          imagePullPolicy: IfNotPresent
          command:
            - percona-server-mongodb-operator
          args:
            - -health-probe-bind-address=:8082
            - -metrics-bind-address=:8083
          env:
            - name: LOG_STRUCTURED
              value: "false"
            - name: LOG_LEVEL
              value: "INFO"
            - name: WATCH_NAMESPACE
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: "percona-server-mongodb-operator"
          ports:
            - name: health
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: 8083
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mongodbOperator.resources | nindent 12 }}
{{- end }}
