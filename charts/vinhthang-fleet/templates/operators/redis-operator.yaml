{{- if .Values.redisOperator.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: operators
  labels:
    app.kubernetes.io/managed-by: Helm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-operator
  namespace: operators
  labels:
    app.kubernetes.io/name: redis-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-operator
  labels:
    app.kubernetes.io/name: redis-operator
rules:
  - apiGroups:
      - redis.redis.opstreelabs.in
    resources:
      - '*'
    verbs:
      - '*'
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/exec
      - services
      - endpoints
      - configmaps
      - secrets
      - events
      - persistentvolumeclaims
      - namespaces
    verbs:
      - '*'
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - '*'
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - '*'
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - '*'
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-operator
  labels:
    app.kubernetes.io/name: redis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-operator
subjects:
  - kind: ServiceAccount
    name: redis-operator
    namespace: operators
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-operator
  namespace: operators
  labels:
    app.kubernetes.io/name: redis-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-operator
    spec:
      serviceAccountName: redis-operator
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.redisOperator.nodeHostname | default "arm10" }}
      containers:
        - name: redis-operator
          image: {{ .Values.redisOperator.image | default "quay.io/opstree/redis-operator:v0.26.0" }}
          imagePullPolicy: IfNotPresent
          command:
            - /operator
            - manager
          args:
            - --leader-elect
          env:
            - name: INIT_CONTAINER_IMAGE
              value: "quay.io/opstree/redis-operator:v0.26.0"
            - name: ENABLE_WEBHOOKS
              value: "false"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redisOperator.resources | nindent 12 }}
{{- end }}
