{{- if .Values.postgres.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.postgres.persistence.storageClass | default "local-storage" }}
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-primary-pv
  labels:
    type: local
    app: postgres-primary
spec:
  capacity:
    storage: {{ .Values.postgres.persistence.primarySize | default "10Gi" }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.postgres.persistence.storageClass | default "local-storage" }}
  local:
    path: {{ .Values.postgres.primaryStoragePath | default "/opt/postgres" }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.postgres.primaryNodeHostname | default "arm10" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-primary-pvc
  namespace: data
  labels:
    app: postgres-primary
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgres.persistence.storageClass | default "local-storage" }}
  resources:
    requests:
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: data
  labels:
    app: postgres
data:
  01-init-databases.sql: |
    SELECT 'CREATE DATABASE memos' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'memos')\gexec
    SELECT 'CREATE DATABASE umami' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'umami')\gexec
    SELECT 'CREATE DATABASE vector_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vector_db')\gexec
  02-init-replication.sh: |
    #!/bin/sh
    psql -U "$POSTGRES_USER" -c "DO \$do\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'replicator') THEN EXECUTE format('CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD %L', '$POSTGRES_PASSWORD'); END IF; END \$do\$;"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-primary
  namespace: data
  labels:
    app: postgres-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.postgres.primaryNodeHostname | default "arm10" }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: "postgres"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          args:
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "max_wal_senders=10"
            - "-c"
            - "max_replication_slots=10"
            - "-c"
            - "hot_standby=on"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -h 127.0.0.1
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -h 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-primary-pvc
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: data
  labels:
    app: postgres-primary
spec:
  type: ClusterIP
  selector:
    app: postgres-primary
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
{{- if .Values.postgres.replica.enabled }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-replica-pv
  labels:
    type: local
    app: postgres-replica
spec:
  capacity:
    storage: {{ .Values.postgres.persistence.replicaSize | default "5Gi" }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.postgres.persistence.storageClass | default "local-storage" }}
  local:
    path: {{ .Values.postgres.replicaStoragePath | default "/opt/postgres-replica" }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.postgres.replicaNodeHostname | default "amd11" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-replica-pvc
  namespace: data
  labels:
    app: postgres-replica
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgres.persistence.storageClass | default "local-storage" }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.replicaSize | default "5Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-replica
  namespace: data
  labels:
    app: postgres-replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-replica
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.postgres.replicaNodeHostname | default "amd11" }}
      initContainers:
        - name: init-replica
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
                echo "Base directory empty. Initiating pg_basebackup from postgres-primary..."
                rm -rf /var/lib/postgresql/data/pgdata/*
                until PGPASSWORD="$POSTGRES_PASSWORD" pg_basebackup -h postgres-primary.data.svc.cluster.local -p 5432 -U replicator -D /var/lib/postgresql/data/pgdata -Fp -Xs -R -v; do
                  echo "Waiting for postgres-primary to be ready..."
                  sleep 3
                done
                chmod 700 /var/lib/postgresql/data/pgdata
                echo "Basebackup successful."
              else
                echo "Replica database already initialized."
              fi
          volumeMounts:
            - name: replica-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: "postgres"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          args:
            - "-c"
            - "hot_standby=on"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -h 127.0.0.1
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -h 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: replica-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml (.Values.postgres.replicaResources | default .Values.postgres.resources) | nindent 12 }}
      volumes:
        - name: replica-data
          persistentVolumeClaim:
            claimName: postgres-replica-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: data
  labels:
    app: postgres-replica
spec:
  type: ClusterIP
  selector:
    app: postgres-replica
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
{{- end }}
---
{{- if .Values.pgpool.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpool
  namespace: data
  labels:
    app: pgpool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgpool
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pgpool
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.pgpool.nodeHostname | default "amd11" }}
      containers:
        - name: pgpool
          image: {{ .Values.pgpool.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: PGPOOL_PARAMS_PORT
              value: "5432"
            - name: PGPOOL_PARAMS_BACKEND_HOSTNAME0
              value: "postgres-primary.data.svc.cluster.local"
            - name: PGPOOL_PARAMS_BACKEND_PORT0
              value: "5432"
            - name: PGPOOL_PARAMS_BACKEND_WEIGHT0
              value: "0"
            - name: PGPOOL_PARAMS_BACKEND_FLAG0
              value: "ALLOW_TO_FAILOVER"
            - name: PGPOOL_PARAMS_BACKEND_HOSTNAME1
              value: "postgres-replica.data.svc.cluster.local"
            - name: PGPOOL_PARAMS_BACKEND_PORT1
              value: "5432"
            - name: PGPOOL_PARAMS_BACKEND_WEIGHT1
              value: "1"
            - name: PGPOOL_PARAMS_BACKEND_FLAG1
              value: "ALLOW_TO_FAILOVER"
            - name: PGPOOL_PARAMS_LOAD_BALANCE_MODE
              value: "on"
            - name: PGPOOL_PARAMS_MASTER_SLAVE_MODE
              value: "on"
            - name: PGPOOL_PARAMS_MASTER_SLAVE_SUB_MODE
              value: "stream"
            - name: PGPOOL_PARAMS_ALLOW_CLEAR_TEXT_FRONTEND_AUTH
              value: "on"
            - name: PGPOOL_PARAMS_SR_CHECK_USER
              value: "postgres"
            - name: PGPOOL_PARAMS_SR_CHECK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USERNAME
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGPOOL_POSTGRES_USERNAME
              value: "postgres"
            - name: PGPOOL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGPOOL_ADMIN_USERNAME
              value: "admin"
            - name: PGPOOL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGPOOL_PARAMS_FAILOVER_ON_BACKEND_ERROR
              value: "off"
            - name: PGPOOL_PARAMS_ENABLE_POOL_HBA
              value: "off"
          resources:
            {{- toYaml .Values.pgpool.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
  labels:
    app: pgpool
spec:
  type: ClusterIP
  selector:
    app: pgpool
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
  labels:
    app: postgres-primary
spec:
  type: ClusterIP
  selector:
    app: postgres-primary
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
{{- end }}
{{- end }}
