{{- if .Values.pulsar.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fleet-pulsar-zookeeper-data-0
  labels:
    type: local
    app: pulsar-zookeeper
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /opt/pulsar/zookeeper/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - oracle10
