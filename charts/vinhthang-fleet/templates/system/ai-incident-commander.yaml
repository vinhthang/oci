{{- if .Values.aiIncidentCommander.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-incident-commander
  namespace: system
  labels:
    app: ai-incident-commander
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-incident-commander-reader
  labels:
    app: ai-incident-commander
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - events
      - nodes
      - namespaces
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-incident-commander-reader
  labels:
    app: ai-incident-commander
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-incident-commander-reader
subjects:
  - kind: ServiceAccount
    name: ai-incident-commander
    namespace: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-incident-commander
  namespace: system
  labels:
    app: ai-incident-commander
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-incident-commander
  template:
    metadata:
      labels:
        app: ai-incident-commander
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.aiIncidentCommander.nodeSelector | default .Values.global.armNodeHostname }}
      serviceAccountName: ai-incident-commander
      containers:
        - name: commander
          image: "{{ .Values.aiIncidentCommander.image.repository }}{{- if .Values.aiIncidentCommander.image.digest }}@{{ .Values.aiIncidentCommander.image.digest }}{{- else }}:{{ .Values.aiIncidentCommander.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.aiIncidentCommander.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.aiIncidentCommander.port | default 8085 }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.aiIncidentCommander.port | default 8085 }}"
            - name: GEMINI_MODEL
              value: "{{ .Values.aiIncidentCommander.model | default "gemini-3.5-flash" }}"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: GITHUB_TOKEN
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-ai-secret
                  key: GEMINI_EMBEDDING_API_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_DSN
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres-primary.data.svc.cluster.local:5432/incident_data?sslmode=disable"
          resources:
            {{- toYaml .Values.aiIncidentCommander.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.aiIncidentCommander.port | default 8085 }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: {{ .Values.aiIncidentCommander.port | default 8085 }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: rtk-binary
              mountPath: /usr/local/bin/rtk
            - name: agy-binary
              mountPath: /usr/local/bin/agy
            - name: agy-config
              mountPath: /root/.gemini
            {{- if .Values.aiIncidentCommander.prompts }}
            - name: templates
              mountPath: /etc/commander/templates
            {{- end }}
      volumes:
        - name: rtk-binary
          hostPath:
            path: /home/opc/.cargo/bin/rtk
            type: FileOrCreate
        - name: agy-binary
          hostPath:
            path: /home/opc/.local/bin/agy
            type: FileOrCreate
        - name: agy-config
          hostPath:
            path: /home/opc/.gemini
            type: DirectoryOrCreate
        {{- if .Values.aiIncidentCommander.prompts }}
        - name: templates
          configMap:
            name: ai-incident-commander-templates
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-incident-commander
  namespace: system
spec:
  type: ClusterIP
  selector:
    app: ai-incident-commander
  ports:
    - protocol: TCP
      port: {{ .Values.aiIncidentCommander.port | default 8085 }}
      targetPort: {{ .Values.aiIncidentCommander.port | default 8085 }}

{{- if .Values.aiIncidentCommander.prompts }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-incident-commander-templates
  namespace: system
data:
  {{- range $key, $val := .Values.aiIncidentCommander.prompts }}
  {{ $key }}: |-
{{ $val | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}
