{{- if .Values.aiIncidentCommander.enabled }}
{{- if .Values.aiIncidentCommander.createWebhookSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.aiIncidentCommander.webhookSecretName | default "ai-commander-webhook-secret" }}
  namespace: system
  labels:
    app: ai-incident-commander
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  WEBHOOK_AUTH_TOKEN: {{ required "aiIncidentCommander.webhookToken is required when createWebhookSecret=true" .Values.aiIncidentCommander.webhookToken | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-incident-commander
  namespace: system
  labels:
    app: ai-incident-commander
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-incident-commander-reader
  labels:
    app: ai-incident-commander
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - events
      - nodes
      - namespaces
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-incident-commander-reader
  labels:
    app: ai-incident-commander
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-incident-commander-reader
subjects:
  - kind: ServiceAccount
    name: ai-incident-commander
    namespace: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-incident-commander
  namespace: system
  labels:
    app: ai-incident-commander
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-incident-commander
  template:
    metadata:
      labels:
        app: ai-incident-commander
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.aiIncidentCommander.nodeSelector | default .Values.global.armNodeHostname }}
      serviceAccountName: ai-incident-commander
      containers:
        - name: commander
          image: "{{ .Values.aiIncidentCommander.image.repository }}{{- if .Values.aiIncidentCommander.image.digest }}@{{ .Values.aiIncidentCommander.image.digest }}{{- else }}:{{ .Values.aiIncidentCommander.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.aiIncidentCommander.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.aiIncidentCommander.port | default 8085 }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.aiIncidentCommander.port | default 8085 }}"
            - name: AGY_MODEL
              value: "{{ .Values.aiIncidentCommander.model | default "gemini-3.8-flash-medium" }}"
            - name: AGY_HOST_AUTH_DIR
              value: "/mnt/host-gemini-cli"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.aiIncidentCommander.otelEndpoint | default "otel-collector.observability.svc.cluster.local:4317" }}"
            - name: SOAK_DURATION
              value: "{{ .Values.aiIncidentCommander.soakDuration | default "60s" }}"
            - name: AUTO_MERGE
              value: "{{ .Values.aiIncidentCommander.autoMerge | default false }}"
            - name: VICTORIAMETRICS_URL
              value: "{{ .Values.aiIncidentCommander.dailyReport.victoriametricsUrl | default "http://victoriametrics.observability.svc.cluster.local:8428" }}"
            - name: WEBHOOK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiIncidentCommander.webhookSecretName | default "ai-commander-webhook-secret" }}
                  key: WEBHOOK_AUTH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: GITHUB_TOKEN
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_DSN
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres-primary.data.svc.cluster.local:5432/incident_data?sslmode=disable"
            - name: MEMOS_DB_DSN
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres-primary.data.svc.cluster.local:5432/memos?sslmode=disable"
          resources:
            {{- toYaml .Values.aiIncidentCommander.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.aiIncidentCommander.port | default 8085 }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.aiIncidentCommander.port | default 8085 }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: rtk-binary
              mountPath: /usr/local/bin/rtk
            - name: agy-binary
              mountPath: /usr/local/bin/agy
            - name: agy-host-auth
              mountPath: /mnt/host-gemini-cli
              readOnly: true
            - name: agy-runtime
              mountPath: /root/.gemini
            {{- if .Values.aiIncidentCommander.prompts }}
            - name: templates
              mountPath: /etc/commander/templates
            {{- end }}
      volumes:
        - name: rtk-binary
          hostPath:
            path: /home/opc/.cargo/bin/rtk
            type: FileOrCreate
        - name: agy-binary
          hostPath:
            path: /home/opc/.local/bin/agy
            type: FileOrCreate
        - name: agy-host-auth
          hostPath:
            path: /home/opc/.gemini/antigravity-cli
            type: DirectoryOrCreate
        - name: agy-runtime
          emptyDir: {}
        {{- if .Values.aiIncidentCommander.prompts }}
        - name: templates
          configMap:
            name: ai-incident-commander-templates
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-incident-commander
  namespace: system
spec:
  type: ClusterIP
  selector:
    app: ai-incident-commander
  ports:
    - protocol: TCP
      port: {{ .Values.aiIncidentCommander.port | default 8085 }}
      targetPort: {{ .Values.aiIncidentCommander.port | default 8085 }}

{{- if .Values.aiIncidentCommander.prompts }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-incident-commander-templates
  namespace: system
data:
  {{- range $key, $val := .Values.aiIncidentCommander.prompts }}
  {{ $key }}: |-
{{ $val | indent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.aiIncidentCommander.dailyReport.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-commander-daily-report
  namespace: system
  labels:
    app: ai-incident-commander
spec:
  schedule: {{ .Values.aiIncidentCommander.dailyReport.schedule | default "15 0 * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: ai-commander-daily-report
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.aiIncidentCommander.nodeSelector | default .Values.global.armNodeHostname }}
          containers:
            - name: trigger
              image: {{ .Values.aiIncidentCommander.dailyReport.image | default "curlimages/curl:8.10.1" }}
              imagePullPolicy: IfNotPresent
              env:
                - name: WEBHOOK_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.aiIncidentCommander.webhookSecretName | default "ai-commander-webhook-secret" }}
                      key: WEBHOOK_AUTH_TOKEN
              command:
                - "/bin/sh"
                - "-c"
                - |
                  set -eu
                  curl -sS --fail-with-body --max-time 25 -X POST \
                    -H "Authorization: Bearer ${WEBHOOK_AUTH_TOKEN}" \
                    "http://ai-incident-commander.system.svc.cluster.local:{{ .Values.aiIncidentCommander.port | default 8085 }}/daily-report"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
{{- end }}
{{- end }}
