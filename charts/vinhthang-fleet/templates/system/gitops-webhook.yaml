apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-webhook
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-deployer
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - configmaps
      - secrets
      - serviceaccounts
      - services
      - endpoints
      - persistentvolumes
      - persistentvolumeclaims
      - pods
      - pods/log
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - podmonitors
      - servicemonitors
      - prometheusrules
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources:
      - redis
      - redisreplications
      - redisclusters
      - redissentinels
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["psmdb.percona.com"]
    resources:
      - perconaservermongodbs
      - perconaservermongodbbackups
      - perconaservermongodbrestores
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitops-deployer
subjects:
  - kind: ServiceAccount
    name: gitops-webhook
    namespace: system
---
{{- if and .Values.gitopsWebhook .Values.gitopsWebhook.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gitopsWebhook.existingSecret | default "gitops-webhook-secret" }}
  namespace: system
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  webhook-secret: {{ required "gitopsWebhook.secret is required when createSecret=true" .Values.gitopsWebhook.secret | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-webhook-script
  namespace: system
data:
  receiver.py: |
{{- .Files.Get "files/receiver.py" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-webhook
  namespace: system
  labels:
    app: gitops-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-webhook
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitops-webhook
      annotations:
        checksum/script: {{ (.Files.Get "files/receiver.py") | sha256sum }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.armNodeHostname }}
      serviceAccountName: gitops-webhook
      hostNetwork: true
      containers:
        - name: webhook
          image: docker.io/alpine/k8s:1.31.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: {{ (.Values.gitopsWebhook | default dict).port | default 9000 | quote }}
            - name: WEBHOOK_STATE_PATH
              value: "/var/lib/gitops-webhook/state.json"
            {{- if and .Values.gitopsWebhook .Values.gitopsWebhook.useSecret }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitopsWebhook.existingSecret | default "gitops-webhook-secret" }}
                  key: {{ .Values.gitopsWebhook.secretKey | default "webhook-secret" }}
                  optional: false
            {{- end }}
          command:
            - "python3"
            - "-u"
            - "/opt/webhook/receiver.py"
          ports:
            - containerPort: {{ (.Values.gitopsWebhook | default dict).port | default 9000 }}
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: webhook-script
              mountPath: /opt/webhook
            - name: webhook-state
              mountPath: /var/lib/gitops-webhook
      volumes:
        - name: webhook-script
          configMap:
            name: gitops-webhook-script
        - name: webhook-state
          hostPath:
            path: /opt/gitops-webhook
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-webhook
  namespace: system
spec:
  type: NodePort
  selector:
    app: gitops-webhook
  ports:
    - protocol: TCP
      port: {{ (.Values.gitopsWebhook | default dict).port | default 9000 }}
      targetPort: {{ (.Values.gitopsWebhook | default dict).port | default 9000 }}
      nodePort: {{ (.Values.gitopsWebhook | default dict).nodePort | default 30009 }}
