apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: vaultwarden
          image: {{ .Values.vaultwarden.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: DOMAIN
              value: "https://vault.{{ .Values.global.domain }}"
            - name: SIGNUPS_ALLOWED
              value: "{{ .Values.vaultwarden.signupsAllowed }}"
            - name: INVITATIONS_ALLOWED
              value: "{{ .Values.vaultwarden.invitationsAllowed }}"
            - name: WEBSOCKET_ENABLED
              value: "{{ .Values.vaultwarden.websocketEnabled }}"
            - name: ENABLE_DB_WAL
              value: "true"
            - name: SHOW_PASSWORD_HINT
              value: "false"
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
          resources:
            requests:
              cpu: {{ .Values.vaultwarden.resources.requests.cpu }}
              memory: {{ .Values.vaultwarden.resources.requests.memory }}
            limits:
              memory: {{ .Values.vaultwarden.resources.limits.memory }}
      volumes:
        - name: vaultwarden-data
          hostPath:
            path: /opt/vaultwarden/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
spec:
  type: NodePort
  selector:
    app: vaultwarden
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: {{ .Values.vaultwarden.nodePort }}
