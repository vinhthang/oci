apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-scrape
  namespace: observability
  labels:
    app: victoriametrics
data:
  scrape.yaml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability:8888', 'otel-collector.observability:8889']
      - job_name: 'caddy-edge'
        static_configs:
          - targets: ['10.0.0.10:2019', '10.0.0.216:2019', 'amd10:2019', 'gce10:2019'] # Best effort targets for edge nodes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: observability
  labels:
    app: victoriametrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      containers:
        - name: victoriametrics
          image: {{ .Values.victoriaMetrics.image }}
          imagePullPolicy: IfNotPresent
          args:
            - "-storageDataPath=/victoria-metrics-data"
            - "-retentionPeriod={{ .Values.victoriaMetrics.retentionPeriod }}"
            - "-promscrape.config=/etc/victoriametrics/scrape.yaml"
            - "-httpListenAddr=:8428"
          ports:
            - containerPort: 8428
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
            - name: scrape-config
              mountPath: /etc/victoriametrics
          resources:
            {{- toYaml .Values.victoriaMetrics.resources | nindent 12 }}
      volumes:
        - name: data
          hostPath:
            path: /opt/victoriametrics
            type: Directory
        - name: scrape-config
          configMap:
            name: victoriametrics-scrape
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: observability
  labels:
    app: victoriametrics
spec:
  type: ClusterIP
  selector:
    app: victoriametrics
  ports:
    - protocol: TCP
      port: 8428
      targetPort: 8428
