aiIncidentCommander:
  enabled: true
  port: 8085
  model: gemini-3.8-flash-medium # Validated via agy models on arm10
  otelEndpoint: otel-collector.observability.svc.cluster.local:4317
  soakDuration: "60s"
  autoMerge: false
  createWebhookSecret: false
  webhookSecretName: ai-commander-webhook-secret
  webhookToken: "" # REQUIRED when createWebhookSecret=true: pass via --set aiIncidentCommander.webhookToken=<token>
  dailyReport:
    enabled: true
    schedule: "15 0 * * *" # 07:15 AM ICT daily (00:15 UTC)
    image: curlimages/curl:8.10.1
    victoriametricsUrl: http://victoriametrics.observability.svc.cluster.local:8428
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/vinhthang/ai-incident-commander
    tag: "0.5.1"
    digest: sha256:69e25b5ede7923bf64c6030e6087bc008044c8b92760cc740901efc42f5dec66
  nodeSelector: arm10
  prompts: {} # e.g., triage.tmpl, fixer.tmpl, reviewer.tmpl
  resources:
    limits:
      memory: 1536Mi
    requests:
      cpu: 20m
      memory: 128Mi
