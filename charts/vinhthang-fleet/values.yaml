pulsar:
  namespace: data
  nodeSelector:
    kubernetes.io/hostname: arm10
  autorecovery:
    nodeSelector:
      kubernetes.io/hostname: arm10
    podMonitor:
      enabled: false
    replicaCount: 1
  bookkeeper:
    nodeSelector:
      kubernetes.io/hostname: arm10
    podMonitor:
      enabled: false
    replicaCount: 1
    resources:
      limits:
        memory: 2048Mi
      requests:
        cpu: 200m
        memory: 1024Mi
    volumes:
      journal:
        size: 5Gi
        storageClassName: local-storage
      ledgers:
        size: 5Gi
        storageClassName: local-storage
  broker:
    ports:
      http: 8088
    configData:
      bookkeeperClientEnforceMinNumRacksPerWriteQuorum: 'false'
      bookkeeperClientMinNumRacksPerWriteQuorum: '1'
      bookkeeperClientRackawarePolicyEnabled: 'false'
      managedLedgerDefaultAckQuorum: '1'
      managedLedgerDefaultEnsembleSize: '1'
      managedLedgerDefaultWriteQuorum: '1'
    nodeSelector:
      kubernetes.io/hostname: arm10
    statefulsetUpgrade:
      enabled: false
    podMonitor:
      enabled: false
    replicaCount: 1
    resources:
      limits:
        memory: 2048Mi
      requests:
        cpu: 200m
        memory: 1024Mi
  components:
    autorecovery: true
    bookkeeper: true
    broker: true
    functions: false
    proxy: false
    pulsar_manager: false
    toolset: false
    zookeeper: true
  enabled: true
  initialize: true
  proxy:
    podMonitor:
      enabled: false
  pulsar_metadata:
    nodeSelector:
      kubernetes.io/hostname: arm10
    podMonitor:
      enabled: false
  toolset:
    podMonitor:
      enabled: false
  victoria-metrics-k8s-stack:
    enabled: false
  zookeeper:
    nodeSelector:
      kubernetes.io/hostname: arm10
    statefulsetUpgrade:
      enabled: false
    podMonitor:
      enabled: false
    replicaCount: 1
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 512Mi
    volumes:
      data:
        size: 5Gi
        storageClassName: local-storage
