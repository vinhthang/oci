aiIncidentCommander:
  enabled: true
  port: 8085
  model: gemini-3.7-flash # Upgraded to Gemini 3.7 Flash; TestFakeAlertIgnored synthetic alert validated
  image:
    pullPolicy: Always
    repository: ghcr.io/vinhthang/ai-incident-commander
    tag: latest
  nodeSelector: arm10
  prompts: {} # e.g., triage.tmpl, fixer.tmpl, reviewer.tmpl
anythingllm:
  enabled: true
  image: docker.io/mintplexlabs/anythingllm:1.16.0
  nodePort: 30001
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 50m
      memory: 256Mi
filebrowser:
  enabled: true
  image: docker.io/filebrowser/filebrowser:v2.63.23
  resources:
    limits:
      memory: 80Mi
    requests:
      cpu: 10m
      memory: 20Mi
global:
  amdArchitecture: amd64
  armNodeHostname: arm10
  domain: vinhthang.dev
grafana:
  enabled: true
  image: docker.io/grafana/grafana:11.5.0
  nodePort: 30008
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 30m
      memory: 64Mi
kube-state-metrics:
  customAnnotations:
    prometheus.io/port: '8080'
    prometheus.io/scrape: 'true'
  namespaceOverride: observability
  nodeSelector:
    kubernetes.io/hostname: arm10
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
memos:
  enabled: true
  image: docker.io/neosmemo/memos:0.30.0
  nodePort: 30005
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi
navidrome:
  enabled: true
  image: docker.io/deluan/navidrome:0.63.2
  nodePort: 30007
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 20m
      memory: 64Mi
oauth2Proxy:
  enabled: true
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
  nodePort: 30004
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 20Mi
otelCollector:
  enabled: true
  image: docker.io/otel/opentelemetry-collector-contrib:0.119.0
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 20m
      memory: 64Mi
pgpool:
  enabled: false
  image: docker.io/pgpool/pgpool:latest
  nodeHostname: arm10
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 64Mi
postgres:
  enabled: true
  image: docker.io/pgvector/pgvector:pg18
  persistence:
    enabled: true
    primarySize: 10Gi
    replicaSize: 5Gi
    storageClass: local-storage
  primaryNodeHostname: arm10
  primaryStoragePath: /opt/postgres
  replica:
    enabled: false
  replicaNodeHostname: arm10
  replicaResources:
    limits:
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 128Mi
  replicaStoragePath: /opt/postgres-replica
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
pulsar:
  autorecovery:
    nodeSelector:
      kubernetes.io/hostname: arm10
    podMonitor:
      enabled: false
    replicaCount: 1
  bookkeeper:
    nodeSelector:
      kubernetes.io/hostname: arm10
    podMonitor:
      enabled: false
    replicaCount: 1
    resources:
      limits:
        memory: 2048Mi
      requests:
        cpu: 200m
        memory: 1024Mi
    volumes:
      journal:
        size: 5Gi
        storageClassName: local-storage
      ledgers:
        size: 5Gi
        storageClassName: local-storage
  broker:
    configData:
      bookkeeperClientEnforceMinNumRacksPerWriteQuorum: 'false'
      bookkeeperClientMinNumRacksPerWriteQuorum: '1'
      bookkeeperClientRackawarePolicyEnabled: 'false'
      managedLedgerDefaultAckQuorum: '1'
      managedLedgerDefaultEnsembleSize: '1'
      managedLedgerDefaultWriteQuorum: '1'
    nodeSelector:
      kubernetes.io/hostname: arm10
    podMonitor:
      enabled: false
    replicaCount: 1
    resources:
      limits:
        memory: 2048Mi
      requests:
        cpu: 200m
        memory: 1024Mi
  components:
    autorecovery: true
    bookkeeper: true
    broker: true
    functions: false
    proxy: false
    pulsar_manager: false
    toolset: false
    zookeeper: true
  enabled: true
  initialize: false
  proxy:
    podMonitor:
      enabled: false
  pulsar_metadata:
    nodeSelector:
      kubernetes.io/hostname: arm10
    podMonitor:
      enabled: false
  toolset:
    podMonitor:
      enabled: false
  victoria-metrics-k8s-stack:
    enabled: false
  zookeeper:
    nodeSelector:
      kubernetes.io/hostname: arm10
    podMonitor:
      enabled: false
    replicaCount: 1
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 512Mi
    volumes:
      data:
        size: 5Gi
        storageClassName: local-storage
redis:
  enabled: true
  image: docker.io/redis:7.4.2-alpine
  maxmemory: 384mb
  maxmemoryPolicy: allkeys-lru
  nodeHostname: arm10
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 25m
      memory: 64Mi
umami:
  enabled: true
  image: ghcr.io/umami-software/umami:postgresql-v2.13.0
  nodePort: 30003
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 30m
      memory: 128Mi
vaultwarden:
  enabled: true
  image: docker.io/vaultwarden/server:1.37.2-alpine
  invitationsAllowed: true
  nodePort: 30010
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 20Mi
  signupsAllowed: true
  websocketEnabled: true
vector:
  enabled: true
  image: docker.io/timberio/vector:0.45.0-alpine
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 20Mi
victoria-metrics-agent:
  namespaceOverride: observability
  nodeSelector:
    kubernetes.io/hostname: arm10
  rbac:
    create: true
  remoteWrite:
  - url: http://victoriametrics.observability.svc.cluster.local:8428/api/v1/write
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  serviceAccount:
    create: true
victoriaLogs:
  enabled: true
  image: docker.io/victoriametrics/victoria-logs:v1.51.1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  retentionPeriod: 30d
victoriaMetrics:
  enabled: true
  image: docker.io/victoriametrics/victoria-metrics:v1.109.1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  retentionPeriod: 30d
vietcalendar:
  enabled: true
  image: ghcr.io/vinhthang/vietcalendar:latest
  nodePort: 30006
  resources:
    limits:
      memory: 80Mi
    requests:
      cpu: 10m
      memory: 20Mi
weaviate:
  enabled: true
  googleApiKey: AIzaSyCMUHFMRjfsmbZZ-Vdr8w8BrB_du1hDTvk
  image: cr.weaviate.io/semitechnologies/weaviate:1.39.0
  mcpServerEnabled: true
  nodeHostname: arm10
  nodePort: 30011
  persistence:
    hostPath: /opt/weaviate/data
    size: 10Gi
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 256Mi
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
