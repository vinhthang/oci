apiVersion: apps/v1
kind: Deployment
metadata:
  name: anythingllm
  labels:
    app: anythingllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anythingllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: anythingllm
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: anythingllm
          image: docker.io/mintplexlabs/anythingllm:1.16.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: STORAGE_DIR
              value: "/app/server/storage"
            - name: SERVER_PORT
              value: "3001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: ANYTHINGLLM_JWT_SECRET
                  optional: true
            - name: VECTOR_DB
              value: "pgvector"
            - name: PGVECTOR_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGVECTOR_CONNECTION_STRING
            - name: PGVECTOR_TABLE_NAME
              value: "anythingllm_vectors"
            - name: EMBEDDING_ENGINE
              value: "native"
            - name: LLM_PROVIDER
              value: "generic-openai"
            - name: GENERIC_OPEN_AI_BASE_PATH
              value: "http://10.0.0.216:8000/v1"
            - name: GENERIC_OPEN_AI_MODEL_PREF
              value: "antigravity-agent"
            - name: GENERIC_OPEN_AI_API_KEY
              value: "agy-local-key"
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: anythingllm-storage
              mountPath: /app/server/storage
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1024Mi
      volumes:
        - name: anythingllm-storage
          hostPath:
            path: /opt/anythingllm
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: anythingllm
spec:
  type: NodePort
  selector:
    app: anythingllm
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
      nodePort: 30001
