apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-webhook
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-deployer
rules:
  - apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io", "rbac.authorization.k8s.io", "storage.k8s.io", "helm.cattle.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitops-deployer
subjects:
  - kind: ServiceAccount
    name: gitops-webhook
    namespace: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-webhook
  namespace: system
  labels:
    app: gitops-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-webhook
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitops-webhook
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      serviceAccountName: gitops-webhook
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
      containers:
        - name: webhook
          image: docker.io/alpine/k8s:1.31.0
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-c"
            - |
              echo "🚀 Starting In-Cluster GitOps Webhook Receiver on port 9000..."
              
              mkdir -p /root/.ssh
              cp /etc/git-secret/ssh-privatekey /root/.ssh/id_ed25519 2>/dev/null || true
              chmod 600 /root/.ssh/id_ed25519 2>/dev/null || true
              ssh-keyscan -H github.com >> /root/.ssh/known_hosts 2>/dev/null || true
              
              while true; do
                printf "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nConnection: close\r\n\r\nGitOps Deploy Triggered\n" | nc -l -p 9000 > /tmp/webhook.req 2>&1 || true
                echo "⚡ [$(date)] GitHub Webhook push event received! Starting GitOps reconcile..."
                
                rm -rf /tmp/vinhthang-fleet
                if git clone --depth 1 https://github.com/vinhthang/oci.git /tmp/vinhthang-fleet; then
                  echo "📥 Repository pulled successfully. Upgrading Helm Fleet..."
                  helm upgrade fleet /tmp/vinhthang-fleet/charts/vinhthang-fleet || echo "⚠️ Helm upgrade returned warning."
                  echo "✅ [$(date)] GitOps reconcile finished successfully!"
                else
                  echo "❌ Failed to clone repository."
                fi
              done
          ports:
            - containerPort: 9000
              name: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-webhook
  namespace: system
spec:
  type: NodePort
  selector:
    app: gitops-webhook
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
      nodePort: 30009
