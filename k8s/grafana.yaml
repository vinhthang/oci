apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # 1. VictoriaMetrics (Default PromQL Metrics TSDB)
      - name: "VictoriaMetrics (PromQL)"
        type: prometheus
        access: proxy
        url: http://victoriametrics:8428
        isDefault: true
        editable: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s
          prometheusType: Prometheus

      # 2. VictoriaLogs (Loki Protocol Log Stream)
      - name: "VictoriaLogs (Logs)"
        type: loki
        access: proxy
        url: http://victorialogs:9428/select/loki/
        editable: true
        jsonData:
          maxLines: 1000

      # 3. PostgreSQL 18 - Umami Web Analytics
      - name: "PostgreSQL 18 - Umami Analytics"
        type: postgres
        access: proxy
        url: postgres:5432
        database: umami
        user: postgres
        secureJsonData:
          password: "postgres_master_pass_2026"
        jsonData:
          sslmode: disable
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1600
        editable: true

      # 4. PostgreSQL 18 - Memos AI Journal
      - name: "PostgreSQL 18 - Memos Notes"
        type: postgres
        access: proxy
        url: postgres:5432
        database: memos
        user: postgres
        secureJsonData:
          password: "postgres_master_pass_2026"
        jsonData:
          sslmode: disable
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1600
        editable: true

      # 5. PostgreSQL 18 - AI Vector Store (pgvector)
      - name: "PostgreSQL 18 - AI Vector Store"
        type: postgres
        access: proxy
        url: postgres:5432
        database: vector_db
        user: postgres
        secureJsonData:
          password: "postgres_master_pass_2026"
        jsonData:
          sslmode: disable
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1600
        editable: true

      # 6. OpenTelemetry Collector Pipeline
      - name: "OpenTelemetry Collector"
        type: prometheus
        access: proxy
        url: http://otel-collector:8889
        editable: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s
          prometheusType: Prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "super_secret_grafana_pass_2026"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_AUTH_PROXY_ENABLED
              value: "true"
            - name: GF_AUTH_PROXY_HEADER_NAME
              value: "X-Auth-Request-Email"
            - name: GF_AUTH_PROXY_HEADER_PROPERTY
              value: "email"
            - name: GF_AUTH_PROXY_AUTO_SIGN_UP
              value: "true"
            - name: GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN
              value: "false"
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: "Admin"
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.vinhthang.dev"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: grafana-data
          hostPath:
            path: /opt/grafana
            type: Directory
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30008
