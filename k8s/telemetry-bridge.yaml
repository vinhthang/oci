apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-bridge
  labels:
    app: telemetry-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-bridge
  template:
    metadata:
      labels:
        app: telemetry-bridge
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      containers:
        - name: bridge
          image: docker.io/library/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-c"
            - |
              pip install --no-cache-dir psycopg2-binary urllib3 prometheus-client
              python -u - << 'EOF'
              import time
              import urllib.request
              import base64
              import psycopg2
              import json
              import re

              DB_DSN = "postgres://postgres:postgres_master_pass_2026@postgres:5432/telemetry"
              KUMA_URL = "http://uptime-kuma:3001/metrics"
              AUTH_HEADER = "Basic " + base64.b64encode(b"scraper:uk1_otel2026").decode("utf-8")

              def parse_prometheus_text(text):
                  records = []
                  for line in text.splitlines():
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      m = re.match(r'^([a-zA-Z_0-9]+)\{(.*)\}\s+([0-9.eE+-]+)$', line)
                      if m:
                          metric_name = m.group(1)
                          tags_raw = m.group(2)
                          val = float(m.group(3))
                          tags = {}
                          for pair in re.findall(r'([a-zA-Z0-9_]+)="([^"]*)"', tags_raw):
                              tags[pair[0]] = pair[1]
                          srv = tags.get("monitor_name", tags.get("service", "unknown"))
                          records.append((srv, metric_name, val, json.dumps(tags)))
                  return records

              def run():
                  print("Starting Telemetry Bridge Daemon -> PostgreSQL 18.6...")
                  while True:
                      try:
                          req = urllib.request.Request(KUMA_URL, headers={"Authorization": AUTH_HEADER})
                          with urllib.request.urlopen(req, timeout=10) as resp:
                              content = resp.read().decode("utf-8")
                          
                          metrics = parse_prometheus_text(content)
                          if metrics:
                              conn = psycopg2.connect(DB_DSN)
                              cur = conn.cursor()
                              cur.executemany("""
                                  INSERT INTO metrics (service_name, metric_name, metric_value, tags)
                                  VALUES (%s, %s, %s, %s::jsonb)
                              """, metrics)
                              conn.commit()
                              cur.close()
                              conn.close()
                              print(f"[{time.strftime('%X')}] Synced {len(metrics)} metrics to PostgreSQL 18")
                      except Exception as e:
                          print("Sync error:", e)
                      time.sleep(30)

              run()
              EOF
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 64Mi
