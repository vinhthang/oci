apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      containers:
        - name: vaultwarden
          image: docker.io/vaultwarden/server:1.37.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: DOMAIN
              value: "https://vault.vinhthang.dev"
            - name: SIGNUPS_ALLOWED
              value: "true"
            - name: INVITATIONS_ALLOWED
              value: "true"
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: ENABLE_DB_WAL
              value: "true"
            - name: SHOW_PASSWORD_HINT
              value: "false"
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 128Mi
      volumes:
        - name: vaultwarden-data
          hostPath:
            path: /opt/vaultwarden/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
spec:
  type: NodePort
  selector:
    app: vaultwarden
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30010
