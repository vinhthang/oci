apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: observability
data:
  vector.yaml: |
    data_dir: /var/lib/vector

    sources:
      k8s_logs:
        type: kubernetes_logs
        auto_partial_merge: true

    transforms:
      format_logs:
        type: remap
        inputs:
          - k8s_logs
        source: |
          .container = .kubernetes.container_name || "unknown"
          .pod = .kubernetes.pod_name || "unknown"
          .namespace = .kubernetes.pod_namespace || "default"
          .node = .kubernetes.node_name || "unknown"
          .stream = .stream || "stdout"

    sinks:
      victorialogs:
        type: loki
        inputs:
          - format_logs
        endpoint: "http://victorialogs.observability.svc.cluster.local:9428/insert/loki/api/v1/push"
        encoding:
          codec: text
        labels:
          app: '{{ `{{ container }}` }}'
          pod: '{{ `{{ pod }}` }}'
          namespace: '{{ `{{ namespace }}` }}'
          node: '{{ `{{ node }}` }}'
          stream: '{{ `{{ stream }}` }}'
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: observability
  labels:
    app: vector
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: {{ .Values.vector.image }}
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - name: VECTOR_LOG
              value: "warn"
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib-docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: var-lib-kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
          resources:
            {{- toYaml .Values.vector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-lib-docker-containers
          hostPath:
            path: /var/lib/docker/containers
        - name: var-lib-kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
        - name: data
          hostPath:
            path: /opt/vector-data
