apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
  labels:
    app: victorialogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victorialogs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: victorialogs
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      containers:
        - name: victorialogs
          image: docker.io/victoriametrics/victoria-logs:v1.51.1
          imagePullPolicy: IfNotPresent
          args:
            - "-storageDataPath=/victoria-logs-data"
            - "-retentionPeriod=30d"
            - "-httpListenAddr=:9428"
          ports:
            - containerPort: 9428
              name: http
          volumeMounts:
            - name: data
              mountPath: /victoria-logs-data
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          hostPath:
            path: /opt/victorialogs
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs
spec:
  selector:
    app: victorialogs
  ports:
    - protocol: TCP
      port: 9428
      targetPort: 9428
