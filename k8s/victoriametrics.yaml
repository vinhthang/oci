apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-scrape
  labels:
    app: victoriametrics
data:
  scrape.yaml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector:8888', 'otel-collector:8889']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  labels:
    app: victoriametrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      nodeSelector:
        kubernetes.io/hostname: arm10
      containers:
        - name: victoriametrics
          image: docker.io/victoriametrics/victoria-metrics:v1.109.1
          imagePullPolicy: IfNotPresent
          args:
            - "-storageDataPath=/victoria-metrics-data"
            - "-retentionPeriod=30d"
            - "-promscrape.config=/etc/victoriametrics/scrape.yaml"
            - "-httpListenAddr=:8428"
          ports:
            - containerPort: 8428
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
            - name: scrape-config
              mountPath: /etc/victoriametrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          hostPath:
            path: /opt/victoriametrics
            type: DirectoryOrCreate
        - name: scrape-config
          configMap:
            name: victoriametrics-scrape
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
spec:
  type: ClusterIP
  selector:
    app: victoriametrics
  ports:
    - protocol: TCP
      port: 8428
      targetPort: 8428
