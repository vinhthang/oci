apiVersion: apps/v1
kind: Deployment
metadata:
  name: vietcalendar
  namespace: apps
  labels:
    app: vietcalendar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vietcalendar
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vietcalendar
    spec:
      nodeSelector:
        kubernetes.io/hostname: amd11
      containers:
        - name: vietcalendar
          image: {{ .Values.vietcalendar.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.vietcalendar.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vietcalendar
  namespace: apps
spec:
  type: NodePort
  selector:
    app: vietcalendar
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: {{ .Values.vietcalendar.nodePort }}
