apiVersion: apps/v1
kind: Deployment
metadata:
  name: vietcalendar
  labels:
    app: vietcalendar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vietcalendar
  template:
    metadata:
      labels:
        app: vietcalendar
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: vietcalendar
          image: ghcr.io/vinhthang/vietcalendar:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              hostPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 80Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vietcalendar
spec:
  type: NodePort
  selector:
    app: vietcalendar
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30006
